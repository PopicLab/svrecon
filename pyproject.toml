[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "svrecon"
description = "Structural-variant reconstruction scoring"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["edlib", "intervaltree", "mappy", "matplotlib", "pandas", "pysam", "pyyaml", "tqdm", "wotplot"]

[project.scripts]
svrecon = "svrecon.cli:main"

[tool.setuptools]
packages = ["svrecon", "svrecon.scorers"]

[tool.setuptools.dynamic]
version = {attr = "svrecon.__version__"}
